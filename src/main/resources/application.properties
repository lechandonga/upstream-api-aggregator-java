server.port=8080

# 上游接入：id 对应 UpstreamClient bean 的 id()，weight 越大越优先
aggregator.upstream.instances[0].id=alpha
aggregator.upstream.instances[0].weight=10
aggregator.upstream.instances[1].id=beta
aggregator.upstream.instances[1].weight=5
# 连续失败 3 次摘除，冷却 30 秒后允许试探恢复
aggregator.upstream.failure-threshold=3
aggregator.upstream.cooldown-millis=30000

# 按调用方限流（令牌桶）：桶容量 10，每秒补充 5 个
aggregator.rate-limit.capacity=10
aggregator.rate-limit.refill-per-second=5
